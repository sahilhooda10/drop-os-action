name: DROP OS paid-access monitor
description: Check Stripe payment, Supabase entitlement, and logged-in customer access without exporting credentials.
inputs:
  endpoint:
    description: DROP OS run-ingestion HTTPS endpoint
    required: true
  target-environment:
    description: >-
      Which of your environments this check is taken against: staging or production.
      Opt in to production deliberately; it is never inferred, and a production check
      requires a live-mode RESTRICTED Stripe key and a dedicated account you control.
    default: staging
  ingress-hosts:
    description: Comma-separated exact hostnames permitted for run ingestion
    required: false
    default: ""
  staging-ingress-hosts:
    description: Previous name for ingress-hosts, still accepted so an older pinned installation keeps working
    required: false
    default: ""
  project-id:
    description: Registered DROP OS project identifier
    required: true
  contract-id:
    description: Sealed paid-access contract identifier
    required: true
  contract-version:
    description: Sealed contract version
    required: true
  spec-hash:
    description: SHA-256 of the sealed contract specification
    required: true
  supersedes-run-id:
    description: UUID of the prior DROP OS run when this is a verified successor
    required: false
    default: ""
  stripe-customer-id:
    description: Opaque Stripe customer identifier, in the mode of the chosen environment
    required: true
  stripe-price-id:
    description: Opaque Stripe price identifier expected for this contract
    required: true
  supabase-url:
    description: Canonical customer Supabase project URL for the chosen environment
    required: true
  supabase-project-ref:
    description: Exact 20-character Supabase project ref holding the entitlement function
    required: false
    default: ""
  staging-supabase-project-ref:
    description: Previous name for supabase-project-ref, still accepted so an older pinned installation keeps working
    required: false
    default: ""
  supabase-rpc:
    description: Narrow entitlement RPC installed by the customer
    default: dropos_read_entitlement
  supabase-schema:
    description: Explicit entitlement RPC schema; never inferred from a connection
    default: public
  release-endpoint:
    description: >-
      An HTTPS URL your application already serves that names the commit it is
      running, on a host in network-hosts. Read before and after the observations;
      if either reading is not the commit being checked the run is refused rather
      than reported. Leave empty and the verdict records that it is about the
      application that answered, not about this release.
    required: false
    default: ""
  release-commit-field:
    description: JSON field in that response holding the 40-character commit
    default: commit
  browser-login-url:
    description: Sign-in page of the application being checked
    required: true
  browser-access-url:
    description: Protected staging page whose access is verified
    required: true
  network-hosts:
    description: Comma-separated exact hostnames the browser check may contact
    required: false
    default: ""
  staging-network-hosts:
    description: Previous name for network-hosts, still accepted so an older pinned installation keeps working
    required: false
    default: ""
  email-selector:
    description: CSS selector for the dedicated test-account email field
    default: input[type="email"]
  password-selector:
    description: CSS selector for the dedicated test-account password field
    default: input[type="password"]
  submit-selector:
    description: CSS selector for the sign-in submit control
    default: button[type="submit"]
  success-selector:
    description: CSS selector visible only to an entitled account
    required: true
  timeout-ms:
    description: Per-browser-step timeout in milliseconds
    default: "20000"
  convergence-retries:
    description: Maximum same-deployment follow-ups while systems settle
    default: "2"
  convergence-max-wait-ms:
    description: Maximum total time allowed for bounded convergence
    default: "120000"
runs:
  using: composite
  steps:
    - name: Verify paid access
      shell: bash
      env:
        DROP_OS_TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
        DROP_OS_ENDPOINT: ${{ inputs.endpoint }}
        DROP_OS_INGRESS_HOSTS: ${{ inputs.ingress-hosts }}
        DROP_OS_STAGING_INGRESS_HOSTS: ${{ inputs.staging-ingress-hosts }}
        DROP_OS_PROJECT_ID: ${{ inputs.project-id }}
        DROP_OS_CONTRACT_ID: ${{ inputs.contract-id }}
        DROP_OS_CONTRACT_VERSION: ${{ inputs.contract-version }}
        DROP_OS_SPEC_HASH: ${{ inputs.spec-hash }}
        DROP_OS_SUPERSEDES_RUN_ID: ${{ inputs.supersedes-run-id }}
        DROP_OS_STRIPE_CUSTOMER_ID: ${{ inputs.stripe-customer-id }}
        DROP_OS_STRIPE_PRICE_ID: ${{ inputs.stripe-price-id }}
        DROP_OS_SUPABASE_PROJECT_REF: ${{ inputs.supabase-project-ref }}
        DROP_OS_STAGING_SUPABASE_PROJECT_REF: ${{ inputs.staging-supabase-project-ref }}
        DROP_OS_SUPABASE_URL: ${{ inputs.supabase-url }}
        DROP_OS_SUPABASE_SCHEMA: ${{ inputs.supabase-schema }}
        DROP_OS_SUPABASE_RPC: ${{ inputs.supabase-rpc }}
        DROP_OS_RELEASE_ENDPOINT: ${{ inputs.release-endpoint }}
        DROP_OS_RELEASE_COMMIT_FIELD: ${{ inputs.release-commit-field }}
        DROP_OS_BROWSER_LOGIN_URL: ${{ inputs.browser-login-url }}
        DROP_OS_BROWSER_ACCESS_URL: ${{ inputs.browser-access-url }}
        DROP_OS_NETWORK_HOSTS: ${{ inputs.network-hosts }}
        DROP_OS_STAGING_NETWORK_HOSTS: ${{ inputs.staging-network-hosts }}
        DROP_OS_EMAIL_SELECTOR: ${{ inputs.email-selector }}
        DROP_OS_PASSWORD_SELECTOR: ${{ inputs.password-selector }}
        DROP_OS_SUBMIT_SELECTOR: ${{ inputs.submit-selector }}
        DROP_OS_SUCCESS_SELECTOR: ${{ inputs.success-selector }}
        DROP_OS_BROWSER_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        DROP_OS_CONVERGENCE_RETRIES: ${{ inputs.convergence-retries }}
        DROP_OS_CONVERGENCE_MAX_WAIT_MS: ${{ inputs.convergence-max-wait-ms }}
      run: node "$GITHUB_ACTION_PATH/runner/index.mjs"
